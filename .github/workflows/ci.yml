name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The package from its wheel, not editable, as the site pipeline installs it: a file the wheel leaves out fails
      # here rather than on a site.
      - name: Install
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/build.txt
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  theme:
    name: Theme script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test tests/js/*.test.mjs

  sites:
    name: Strict builds of the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/build.txt
          python -m pip install --no-deps .
      - name: Build and check
        run: |
          for config in examples/basic-site/mkdocs.yml examples/obsidian-vault/mkdocs.yml; do
            site="$RUNNER_TEMP/$(basename "$(dirname "$config")")"
            umccr-docs check --config "$config"
            umccr-docs build --config "$config" --site-dir "$site"
            umccr-docs verify-site "$site"
          done

  repository:
    name: Workflows, secrets and information boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor --no-progress .github/workflows
      - name: detect-secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Information boundary
        run: scripts/check-boundary.sh
