[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "umccr-docs"
version = "0.3.1"
description = "Check, build and publish UMCCR documentation sites for docs.umccr.org"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The documentation engine and its extensions are pinned, with hashes, in requirements/build.txt.
dependencies = [
  "PyYAML>=6.0",
  "boto3>=1.34",
]

[project.scripts]
umccr-docs = "umccr_docs.cli:main"

[project.urls]
Homepage = "https://github.com/umccr/docs-toolkit"
Changelog = "https://github.com/umccr/docs-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/umccr/docs-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/umccr_docs"]
# Hatch leaves out of the wheel whatever .gitignore ignores. This repository's ignores no script, but the theme's are
# listed anyway: built in umccr/docs-platform, whose .gitignore ignores `*.js`, the wheel that CI and the site pipeline
# installed once had no umccr.js, and every page lost its catalogue, account menu and chat panel:
# https://github.com/umccr/docs-platform/blob/main/docs/issues/2026-10-21-theme-script-missing-from-wheel.md
artifacts = ["src/umccr_docs/theme/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# assert is the pytest idiom; subprocess calls use fixed argument lists.
ignore = ["S101", "S603", "S607"]
