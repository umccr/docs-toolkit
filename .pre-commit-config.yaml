# Local hooks mirroring CI (.github/workflows/ci.yml). `make install` installs them as the git pre-commit hook, and
# `make check` runs them on every tracked file. Both need pre-commit itself: https://pre-commit.com/#install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The theme's copy of Mermaid, a 3.6 MB bundle, stays byte for byte as the mermaid package on npm ships it
      # (CONTRIBUTING.md, "Update pinned dependencies").
      - id: check-added-large-files
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: check-yaml
        args: ['--unsafe'] # mkdocs.yml may hold tags the contract then rejects with a clearer message
      - id: end-of-file-fixer
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: trailing-whitespace
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^requirements/.*\.txt$

  - repo: local
    hooks:
      - id: information-boundary
        name: information boundary
        entry: scripts/check-boundary.sh
        language: system
        pass_filenames: false
      # The virtualenv's ruff, pinned in requirements/dev.txt, as `make check` and CI use. A commit from an editor often
      # runs without .venv/bin on its PATH.
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --check
        language: system
        pass_filenames: false
        types: [python]
