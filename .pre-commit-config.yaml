# The repository's checks. `make install` installs them as the git pre-commit hook, `make check` runs them on every
# tracked file, and CI runs them too (.github/workflows/ci.yml). Each hook is pinned to a commit, with its version in
# the comment: `pre-commit autoupdate --freeze` moves them. pre-commit itself: https://pre-commit.com/#install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # The theme's copy of Mermaid, a 3.6 MB bundle, stays byte for byte as the mermaid package on npm ships it
      # (CONTRIBUTING.md, "Update pinned dependencies").
      - id: check-added-large-files
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: check-yaml
        args: ['--unsafe'] # mkdocs.yml may hold tags the contract then rejects with a clearer message
      - id: end-of-file-fixer
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: trailing-whitespace
        exclude: ^src/umccr_docs/theme/assets/umccr/mermaid/
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
    hooks:
      # Not the requirements' hashes, nor this file's commit SHAs: both read as high-entropy strings.
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(requirements/.*\.txt|\.pre-commit-config\.yaml)$

  # The workflows: actionlint for mistakes, zizmor for security problems.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # The virtualenv's ruff, pinned in requirements/dev.txt, as `make check` uses it; CI runs it in its "Tests and
      # lint" job. A commit from an editor often runs without .venv/bin on its PATH.
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --check
        language: system
        pass_filenames: false
        types: [python]
